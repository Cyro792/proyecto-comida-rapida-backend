server.port=8083

# Configuración de la conexión a la Base de Datos (Laragon)
spring.datasource.url=jdbc:mysql://localhost:3306/microservicio_inventario?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Activación de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true